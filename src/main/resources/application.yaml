spring:
  application:
    name: kstream
  # Fix: Need to expose your SASL password securely via an environment variable or local string
  kafka:
    properties:
      sasl.jaas.config: "org.apache.kafka.common.security.scram.ScramLoginModule required username=\"avnadmin\" password=\"${KAFKA_SASL_PASSWORD}\";"

kafka:
  streams:
    application-id: mdm-sap-gts-material-processor
    bootstrap-servers: kafka-962173a-venky4c-74a1.j.aivencloud.com:21341
    default-key-serde: org.apache.kafka.common.serialization.Serdes$StringSerde
    default-value-serde: org.apache.kafka.common.serialization.Serdes$StringSerde
    security-protocol: "SASL_SSL"
    sasl-mechanism: "SCRAM-SHA-256"
    ssl-endpoint-identification-algorithm: ""
    ssl-truststore-type: "jks"
    truststore-location: "D:/forGit/aiven-kafka/kafka-streams/src/main/resources/client.truststore.jks"
    ssl-truststore-password: "${KAFKA_TRUSTSTORE_PASSWORD}"
    sasl-username: "avnadmin"
    sasl-password: "${KAFKA_SASL_PASSWORD}"
# --- Critical Property Bindings Required by KafkaStreamProcessor Java Code ---
  resource:
    helper:
      topic: "material-helper"
    data:
      topic: "material-data"
    error:
      topic: "material-error"
    observability:
      error:
        topic: "common.observability.error"
    schemaType: "json"
    observability.enrich-error: true
    environment: "DEV"

