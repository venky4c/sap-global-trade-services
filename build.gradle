plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.stream'
version = '1.0.0'

java {
    sourceCompatibility = '21'
}

repositories {
    // Only use standard Maven Central - no extra external networks required
    mavenCentral()
}

dependencies {
    // Spring Boot Core & Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Native Apache Kafka & Kafka Streams
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-streams'

    // Industry standard Open-Source JSON Schema Validator (from Maven Central)
    implementation 'com.networknt:json-schema-validator:1.4.0'

    // JSON Manipulation (Required by MessageTransformationService)
    implementation 'org.json:json:20240303'

    // Jackson for Model mapping
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    testCompileOnly 'org.projectlombok:lombok:1.18.32'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.apache.kafka:kafka-streams-test-utils'
}

tasks.named('test') {
    useJUnitPlatform()
}